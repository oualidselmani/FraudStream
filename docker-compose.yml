services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "kafka:9092"
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  producer:
    build:
      context: ./producer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BROKER: kafka:9092
      SEND_DELAY: "0.05"
      MAX_TXNS: "0"

  spark:
    build:
      context: ./spark
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./model:/app/model
      - spark_checkpoint:/app/checkpoint
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URI: mongodb://mongodb:27017
      FRAUD_THRESHOLD: "0.7"
      SUSPECT_THRESHOLD: "0.3"
      TZ: Africa/Casablanca
  dashboard:
    build:
      context: ./dashboard
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      TZ: Africa/Casablanca

volumes:
  mongo_data:
  spark_checkpoint: